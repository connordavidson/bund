[package]
name = "bund-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "bund"
path = "src/main.rs"

[dependencies]
bund-core.workspace = true
bund-providers.workspace = true
bund-tools.workspace = true
bund-store.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
crossterm.workspace = true
dirs.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
ratatui-textarea = { version = "0.9", default-features = false, features = ["crossterm"] }
toml = "0.9"
toml_edit = "0.23"
tempfile.workspace = true
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
rpassword = "7"
security-framework = "3"
security-framework-sys = "2"

[dev-dependencies]
nix.workspace = true
vt100 = "0.16"
