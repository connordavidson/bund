name: Release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p bund-cli
      - name: Package binary and documentation
        run: |
          mkdir package
          cp target/release/bund README.md package/
          tar -czf bund-${{ matrix.target }}.tar.gz -C package .
          shasum -a 256 bund-${{ matrix.target }}.tar.gz > bund-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bund-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256
