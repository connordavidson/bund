[workspace]
members = ["crates/bund-core", "crates/bund-providers", "crates/bund-tools", "crates/bund-store", "crates/bund-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.88"

[workspace.dependencies]
bund-core = { path = "crates/bund-core" }
bund-providers = { path = "crates/bund-providers" }
bund-tools = { path = "crates/bund-tools" }
bund-store = { path = "crates/bund-store" }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
jsonschema = { version = "0.33", default-features = false }
nix = { version = "0.31", features = ["signal", "process", "term", "fs"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
